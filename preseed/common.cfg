# Shared by install.cfg and reinstall.cfg. Only answers the questions we
# care about; everything else (locale, keyboard, network, hostname, user,
# passwords, disk, timezone) is still asked interactively.

# Mirror (the base role rewrites sources to the same place anyway).
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Minimal GNOME: gnome-core instead of tasksel's GNOME task, which pulls
# in the full "gnome" metapackage (LibreOffice, Evolution, Shotwell, ...).
# The rest of the list is what task-desktop would have added that we want:
# Debian theming, mDNS for the driverless printer, anacron for a laptop.
tasksel tasksel/first multiselect standard
d-i pkgsel/include string gnome-core network-manager desktop-base avahi-daemon libnss-mdns anacron xdg-utils
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false
