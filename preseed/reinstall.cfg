# Reinstall over an existing install.cfg layout, keeping /home.
# Partitioning is manual (see README): unlock the LUKS volume from a shell,
# then format root and /boot but keep the home logical volume.

d-i preseed/include string common.cfg

# Make sure the crypto tools are in the installer before partitioning.
d-i anna/choose_modules string partman-crypto

# The installer only sets up boot-time unlocking for volumes it created
# itself. So: install the tools, add a crypttab entry for each crypt device
# unlocked by hand, and rebuild the initramfs so the new system can boot.
d-i preseed/late_command string \
    apt-install cryptsetup-initramfs lvm2; \
    for m in $(dmsetup ls --target crypt | cut -f1); do \
        dev=$(cryptsetup status "$m" | sed -n 's/^ *device: *//p'); \
        uuid=$(chroot /target blkid -s UUID -o value "$dev"); \
        [ -n "$uuid" ] || continue; \
        grep -qs "$uuid" /target/etc/crypttab || \
            echo "$m UUID=$uuid none luks,discard" >> /target/etc/crypttab; \
    done; \
    in-target update-initramfs -u -k all
