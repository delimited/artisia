# First install: WIPES THE CHOSEN DISK. For a reinstall that keeps /home,
# use reinstall.cfg instead.
#
# Layout (GPT): EFI | /boot | LUKS -> LVM { root 100G, swap 8G, home rest }
# /home is its own logical volume so a later reinstall can format root and
# leave home alone.
#
# The disk choice, encryption passphrase and final "write changes" are
# deliberately not preseeded, so the installer still stops and asks.

d-i preseed/include string common.cfg

d-i partman-auto/method string crypto
# Don't fill the LUKS volume with random data first: on an SSD it's a full
# drive write that TRIM later discards anyway. Use `nvme format` or
# `blkdiscard` beforehand if old data must be unrecoverable.
d-i partman-auto-crypto/erase_disks boolean false
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/expert_recipe string \
    artisia :: \
        538 538 1075 free \
            $iflabel{ gpt } $reusemethod{ } \
            method{ efi } format{ } \
        . \
        1024 1024 1024 ext4 \
            $defaultignore{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /boot } \
        . \
        100000 100000 100000 ext4 \
            $lvmok{ } lv_name{ root } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ / } \
        . \
        8192 8192 8192 linux-swap \
            $lvmok{ } lv_name{ swap } \
            method{ swap } format{ } \
        . \
        20000 10000 -1 ext4 \
            $lvmok{ } lv_name{ home } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /home } \
        .
