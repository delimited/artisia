---
# The person whose machine this is. Taken from the account running ansible-playbook.
desktop_user: "{{ lookup('env', 'USER') }}"
desktop_home: "/home/{{ desktop_user }}"

# --- base ---
base_packages:
  - build-essential
  - curl
  - wget
  - git
  - unzip
  - htop
  - vim
  - fwupd            # firmware updates from LVFS (Lenovo publishes there)
  - mokutil
  - nvme-cli         # SSD health: sudo nvme smart-log /dev/nvme0
  - linux-headers-amd64

# systemd units masked by the base role. Package updates are run by hand, so
# nothing checks for them in the background (GNOME Software's checks are
# switched off in gnome_settings below).
masked_units:
  - ModemManager.service       # no WWAN modem in this machine
  - apt-daily.timer            # apt update + download
  - apt-daily-upgrade.timer    # unattended upgrades

# --- extrepo (external apt repos) ---
# VS Code and the Claude repos are proprietary, so need "non-free".
extrepo_policies:
  - main
  - non-free

# --- java ---
# Debian 13 ships OpenJDK 25 in main, so no vendor repo is needed.
java_major: 25
java_packages:
  - "openjdk-{{ java_major }}-jdk"
  - maven

# --- docker ---
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# --- devtools ---
devtools_packages:
  - code             # VS Code, Microsoft repo
  - claude-desktop   # Anthropic repo
  - claude-code      # Anthropic repo, stable channel; updates via apt
install_jetbrains_toolbox: true

# --- desktop ---
desktop_packages:
  - firefox          # Mozilla repo (current release, not ESR)
  - thunderbird
  - keepassxc
  - fprintd
  - libpam-fprintd
  # Brother DCP-L2627DW: driverless printing (IPP Everywhere) and scanning (eSCL)
  - cups
  - ipp-usb
  - sane-airscan
  - simple-scan
  # GNOME extras
  - gnome-shell-extension-appindicator   # tray icons (KeePassXC, Spotify, Claude)
  - gnome-shell-extension-dashtodock     # dock outside the overview
  - gnome-tweaks
  - gnome-shell-extension-manager
  - dconf-cli                            # applies gnome_settings below
  # Fallback for symbols the Nerd Font lacks, e.g. Claude Code's ⎿ (U+23BF)
  - fonts-symbola
  - ptyxis           # default terminal, see terminal_app below

remove_firefox_esr: true

# Debian's fonts-jetbrains-mono lacks the Nerd Font icons, so this comes from
# the Nerd Fonts GitHub release. Bump both together (checksums are in the
# release's SHA-256.txt).
nerd_font_version: "3.5.1"
nerd_font_name: JetBrainsMono
nerd_font_checksum: "sha256:04d5e8f903693f9dd13e16f867e994834e681eb3c72c0d337a770dcda09010cf"

flatpaks:
  - com.spotify.Client
  - com.github.johnfactotum.Foliate   # ePub reader
  - org.gnome.Papers                  # PDF viewer (GNOME's successor to Evince)
  - com.github.tchx84.Flatseal        # edit Flatpak permissions
  - org.videolan.VLC		      # video player with bundled codecs

# System-wide GNOME defaults (/etc/dconf/db/local.d). Anything you change in
# Settings still wins, and survives reinstalls along with /home.
# Values use GVariant syntax, so strings need inner quotes.
gnome_settings:
  org/gnome/desktop/interface:
    color-scheme: "'prefer-dark'"
    gtk-theme: "'Adwaita-dark'"      # older GTK 3 apps ignore color-scheme
    # 200% for the 4K panel. Mutter uses this for any display without a
    # saved layout; Settings → Displays can still change it per display.
    scaling-factor: "uint32 2"
  org/gnome/desktop/wm/preferences:
    button-layout: "'appmenu:minimize,maximize,close'"
  org/gnome/shell:
    # Debian ships AppIndicator under Ubuntu's UUID, not upstream's.
    enabled-extensions: "['ubuntu-appindicators@ubuntu.com', 'dash-to-dock@micxgx.gmail.com']"
  org/gnome/shell/extensions/dash-to-dock:
    dock-position: "'LEFT'"
    # Hidden until the pointer touches the left edge. intellihide would
    # instead keep it visible whenever no window overlaps it.
    dock-fixed: "false"
    autohide: "true"
    intellihide: "false"
  # GNOME Terminal's built-in default profile; its UUID is fixed.
  "org/gnome/terminal/legacy/profiles:/:b1dcc9dd-5262-4d8d-a863-c897e6d979b9":
    use-system-font: "false"
    font: "'JetBrainsMono Nerd Font 11'"
  org/gnome/Ptyxis:
    use-system-font: "false"
    font-name: "'JetBrainsMono Nerd Font 11'"
  # Turning off download-updates still leaves daily checks running.
  # allow-updates is the only key that stops them; it also hides the
  # Updates page (use apt, flatpak update and fwupdmgr instead).
  org/gnome/software:
    allow-updates: "false"
    download-updates: "false"

# Default terminal, by desktop file ID. GLib opens Terminal=true apps through
# xdg-terminal-exec, which otherwise prefers GNOME Terminal under GNOME.
terminal_app: org.gnome.Ptyxis.desktop

# System-wide default apps (/etc/xdg/mimeapps.list); per-user choices still win.
# Flatpak names each launcher after its app ID.
default_apps:
  application/pdf: org.gnome.Papers.desktop
  application/epub+zip: com.github.johnfactotum.Foliate.desktop
