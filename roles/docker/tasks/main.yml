---
- name: Docker apt repository
  ansible.builtin.import_role:
    name: extrepo
  vars:
    extrepo_repos: [docker-ce]

- name: Install Docker Engine
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Start Docker on boot
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Add the desktop user to the docker group
  ansible.builtin.user:
    name: "{{ desktop_user }}"
    groups: docker
    append: true
