---
# The vscode and Claude Desktop entries also stop those packages adding
# duplicate copies of their own repos.
- name: VS Code and Claude apt repositories
  ansible.builtin.import_role:
    name: extrepo
  vars:
    extrepo_repos:
      - vscode
      - anthropic-claude-desktop
      - anthropic-claude-code

- name: Install developer tools
  ansible.builtin.apt:
    name: "{{ devtools_packages }}"
    state: present
    update_cache: true

# /home survives reinstalls, and an old native-installer copy of Claude Code
# in ~/.local/bin would shadow the apt one in /usr/bin. ~/.claude (settings,
# history) is left alone.
- name: Remove the native-installer Claude Code
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ desktop_home }}/.local/bin/claude"
    - "{{ desktop_home }}/.local/share/claude"

# --- Per-user installs (run as the desktop user, not root) ---

- name: JetBrains Toolbox
  when: install_jetbrains_toolbox
  become: true
  become_user: "{{ desktop_user }}"
  block:
    - name: Check for an existing Toolbox download
      ansible.builtin.stat:
        path: "{{ desktop_home }}/.local/opt/jetbrains-toolbox"
      register: devtools_toolbox_dir

    - name: Fetch and unpack the latest Toolbox
      when: not devtools_toolbox_dir.stat.exists
      block:
        - name: Look up the latest Toolbox release
          ansible.builtin.uri:
            url: https://data.services.jetbrains.com/products/releases?code=TBA&latest=true&type=release
            return_content: true
          register: devtools_toolbox_release

        - name: Create Toolbox directory
          ansible.builtin.file:
            path: "{{ desktop_home }}/.local/opt/jetbrains-toolbox"
            state: directory
            mode: "0755"

        - name: Download and unpack Toolbox
          ansible.builtin.unarchive:
            src: "{{ devtools_toolbox_release.json.TBA[0].downloads.linux.link }}"
            dest: "{{ desktop_home }}/.local/opt/jetbrains-toolbox"
            remote_src: true
            extra_opts: [--strip-components=1]

        - name: Toolbox next step
          ansible.builtin.debug:
            msg: >-
              Run the jetbrains-toolbox binary in ~/.local/opt/jetbrains-toolbox once;
              it installs itself, adds a GNOME launcher, and IntelliJ installs from there.
