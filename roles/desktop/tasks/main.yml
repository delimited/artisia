---
# --- Firefox from Mozilla (current release rather than Debian's ESR) ---
- name: Mozilla apt repository
  ansible.builtin.import_role:
    name: extrepo
  vars:
    extrepo_repos: [mozilla]

- name: Prefer Mozilla's packages over Debian's for Firefox
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/mozilla
    content: |
      Package: *
      Pin: origin packages.mozilla.org
      Pin-Priority: 1000
    mode: "0644"

- name: Install desktop packages
  ansible.builtin.apt:
    name: "{{ desktop_packages }}"
    state: present
    update_cache: true

- name: Remove Firefox ESR
  ansible.builtin.apt:
    name: firefox-esr
    state: absent
    purge: true
  when: remove_firefox_esr

# --- Nerd Font for the terminal (not packaged in Debian) ---
- name: Download {{ nerd_font_name }} Nerd Font
  ansible.builtin.get_url:
    url: "https://github.com/ryanoasis/nerd-fonts/releases/download/v{{ nerd_font_version }}/{{ nerd_font_name }}.tar.xz"
    dest: "/var/cache/{{ nerd_font_name }}-nerd-font-{{ nerd_font_version }}.tar.xz"
    checksum: "{{ nerd_font_checksum }}"
    mode: "0644"

- name: Create the Nerd Font directory
  ansible.builtin.file:
    path: "/usr/local/share/fonts/{{ nerd_font_name }}NerdFont"
    state: directory
    mode: "0755"

- name: Unpack {{ nerd_font_name }} Nerd Font
  ansible.builtin.unarchive:
    src: "/var/cache/{{ nerd_font_name }}-nerd-font-{{ nerd_font_version }}.tar.xz"
    dest: "/usr/local/share/fonts/{{ nerd_font_name }}NerdFont"
    remote_src: true
  ignore_errors: "{{ ansible_check_mode }}"
  notify: Update font cache

# --- Fingerprint reader: allow it for login and sudo ---
- name: Enable fingerprint authentication in PAM
  ansible.builtin.command: pam-auth-update --enable fprintd
  changed_when: false

- name: Fingerprint enrolment reminder
  ansible.builtin.debug:
    msg: "Enrol a finger in Settings → Users → Fingerprint Login (or run 'fprintd-enroll')."

# --- Flatpak + Flathub for non-developer desktop apps ---
- name: Install Flatpak and GNOME Software integration
  ansible.builtin.apt:
    name:
      - flatpak
      - gnome-software-plugin-flatpak
    state: present

- name: Add Flathub
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    method: system
    state: present

- name: Install Flatpak apps
  community.general.flatpak:
    name: "{{ flatpaks }}"
    remote: flathub
    method: system
    state: present

# Trixie's GNOME still defaults to Evince for PDFs.
- name: Set default apps for document types
  community.general.ini_file:
    path: /etc/xdg/mimeapps.list
    section: Default Applications
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop: "{{ default_apps | dict2items }}"

# --- GNOME defaults via a system dconf database ---
- name: Read user settings, then the system defaults
  ansible.builtin.copy:
    dest: /etc/dconf/profile/user
    content: |
      user-db:user
      system-db:local
    mode: "0644"
  notify: Update dconf databases

- name: Create the system dconf keyfile directory
  ansible.builtin.file:
    path: /etc/dconf/db/local.d
    state: directory
    mode: "0755"

- name: GNOME default settings
  ansible.builtin.template:
    src: gnome-defaults.j2
    dest: /etc/dconf/db/local.d/00-artisia
    mode: "0644"
  notify: Update dconf databases
