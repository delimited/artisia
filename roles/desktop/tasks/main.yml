---
# --- Firefox from Mozilla (current release rather than Debian's ESR) ---
- name: Mozilla apt repository
  ansible.builtin.import_role:
    name: extrepo
  vars:
    extrepo_repos: [mozilla]

- name: Prefer Mozilla's packages over Debian's for Firefox
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/mozilla
    content: |
      Package: *
      Pin: origin packages.mozilla.org
      Pin-Priority: 1000
    mode: "0644"

- name: Install desktop packages
  ansible.builtin.apt:
    name: "{{ desktop_packages }}"
    state: present
    update_cache: true

- name: Remove Firefox ESR
  ansible.builtin.apt:
    name: firefox-esr
    state: absent
    purge: true
  when: remove_firefox_esr

# --- Nerd Font for the terminal (not packaged in Debian) ---
- name: Download {{ nerd_font_name }} Nerd Font
  ansible.builtin.get_url:
    url: "https://github.com/ryanoasis/nerd-fonts/releases/download/v{{ nerd_font_version }}/{{ nerd_font_name }}.tar.xz"
    dest: "/var/cache/{{ nerd_font_name }}-nerd-font-{{ nerd_font_version }}.tar.xz"
    checksum: "{{ nerd_font_checksum }}"
    mode: "0644"

- name: Create the Nerd Font directory
  ansible.builtin.file:
    path: "/usr/local/share/fonts/{{ nerd_font_name }}NerdFont"
    state: directory
    mode: "0755"

- name: Unpack {{ nerd_font_name }} Nerd Font
  ansible.builtin.unarchive:
    src: "/var/cache/{{ nerd_font_name }}-nerd-font-{{ nerd_font_version }}.tar.xz"
    dest: "/usr/local/share/fonts/{{ nerd_font_name }}NerdFont"
    remote_src: true
  ignore_errors: "{{ ansible_check_mode }}"
  notify: Update font cache

# --- Fingerprint reader: login and lock screen only ---
# GDM checks fingerprints through its own gdm-fingerprint PAM stack.
# libpam-fprintd's common-auth profile is left off (its default): there,
# sudo waits 10s for a finger before every password prompt, which stalls
# each Ansible task.
- name: Fingerprint enrolment reminder
  ansible.builtin.debug:
    msg: "Enrol a finger in Settings → Users → Fingerprint Login (or run 'fprintd-enroll')."

# --- Printing: permanent driverless queues ---
# cups-browsed would otherwise create the queues on the fly (implicitclass://)
# and drop them when it stops. Mask it first, then add fixed queues under the
# same names. GTK print dialogs still discover other LAN printers via CUPS.
- name: Mask cups-browsed
  ansible.builtin.systemd_service:
    name: cups-browsed.service
    masked: true
    state: stopped

- name: Read the existing printer queues
  ansible.builtin.command: lpstat -v
  register: desktop_lpstat
  changed_when: false
  failed_when: false   # exits non-zero when there are no queues

# '-m everywhere' asks the printer for its capabilities, so this only works
# while it's reachable. Don't fail the whole run when away from home.
- name: Add printer queues
  ansible.builtin.command: lpadmin -p {{ item.name }} -E -v {{ item.uri | quote }} -m everywhere
  loop: "{{ printers }}"
  when: "('device for ' ~ item.name ~ ': ' ~ item.uri) not in desktop_lpstat.stdout"
  register: desktop_lpadmin
  changed_when: desktop_lpadmin.rc == 0
  failed_when: false

- name: Printers that couldn't be added
  ansible.builtin.debug:
    msg: "Couldn't add {{ item.item.name }} ({{ item.stderr }}). Rerun with '--tags desktop' when it's on the network."
  loop: "{{ desktop_lpadmin.results | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0) }}"
  loop_control:
    label: "{{ item.item.name }}"

# --- Flatpak + Flathub for non-developer desktop apps ---
- name: Install Flatpak and GNOME Software integration
  ansible.builtin.apt:
    name:
      - flatpak
      - gnome-software-plugin-flatpak
    state: present

- name: Add Flathub
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    method: system
    state: present

- name: Install Flatpak apps
  community.general.flatpak:
    name: "{{ flatpaks }}"
    remote: flathub
    method: system
    state: present

# Trixie's GNOME still defaults to Evince for PDFs.
- name: Set default apps for document types
  community.general.ini_file:
    path: /etc/xdg/mimeapps.list
    section: Default Applications
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop: "{{ default_apps | dict2items }}"

# xdg-terminal-exec reads /etc/xdg before its own GNOME list, which names
# GNOME Terminal. gnome-core still pulls that in, so it stays installed.
- name: Set the default terminal for xdg-terminal-exec
  ansible.builtin.copy:
    dest: /etc/xdg/xdg-terminals.list
    content: |
      {{ terminal_app }}
    mode: "0644"

# Ptyxis and GNOME Terminal register the same priority, so auto mode keeps
# whichever was installed first.
- name: Point x-terminal-emulator at Ptyxis
  community.general.alternatives:
    name: x-terminal-emulator
    path: /usr/bin/ptyxis
  ignore_errors: "{{ ansible_check_mode }}"

# --- GNOME defaults via a system dconf database ---
- name: Read user settings, then the system defaults
  ansible.builtin.copy:
    dest: /etc/dconf/profile/user
    content: |
      user-db:user
      system-db:local
    mode: "0644"
  notify: Update dconf databases

- name: Create the system dconf keyfile directory
  ansible.builtin.file:
    path: /etc/dconf/db/local.d
    state: directory
    mode: "0755"

- name: GNOME default settings
  ansible.builtin.template:
    src: gnome-defaults.j2
    dest: /etc/dconf/db/local.d/00-artisia
    mode: "0644"
  notify: Update dconf databases
