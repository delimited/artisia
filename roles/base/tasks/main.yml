---
# Replace whatever the installer wrote with deb822 sources that include
# contrib, non-free and non-free-firmware (needed for the NVIDIA driver).
- name: Debian main archive (trixie, trixie-updates)
  ansible.builtin.deb822_repository:
    name: debian
    types: [deb]
    uris: [http://deb.debian.org/debian]
    suites: [trixie, trixie-updates]
    components: &components [main, contrib, non-free, non-free-firmware]
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
  notify: Update apt cache

- name: Debian security archive
  ansible.builtin.deb822_repository:
    name: debian-security
    types: [deb]
    uris: [http://security.debian.org/debian-security]
    suites: [trixie-security]
    components: *components
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
  notify: Update apt cache

- name: Retire the legacy one-line sources.list
  ansible.builtin.copy:
    dest: /etc/apt/sources.list
    content: "# Managed by Ansible: sources live in /etc/apt/sources.list.d/*.sources\n"
    mode: "0644"
  notify: Update apt cache

- name: Apply apt source changes now
  ansible.builtin.meta: flush_handlers

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: safe
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

# Weekly TRIM for the SSD (through LUKS via crypttab's "discard").
# On by default for new installs; made explicit here.
- name: Enable periodic TRIM
  ansible.builtin.systemd_service:
    name: fstrim.timer
    enabled: true
    state: started

# Masked rather than disabled: ModemManager is D-Bus activatable and
# NetworkManager would start it again on demand.
- name: Mask unwanted background services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
    state: stopped
  loop: "{{ masked_units }}"

# Firmware updates are rare and easy to forget, so unlike packages the LVFS
# metadata keeps refreshing on its own: weekly instead of fwupd's hourly.
- name: Create the fwupd-refresh timer drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/fwupd-refresh.timer.d
    state: directory
    mode: "0755"

- name: Refresh firmware metadata weekly
  ansible.builtin.copy:
    dest: /etc/systemd/system/fwupd-refresh.timer.d/weekly.conf
    content: |
      # Managed by Ansible
      [Timer]
      OnCalendar=
      OnCalendar=weekly
    mode: "0644"
  notify: Restart fwupd-refresh timer

- name: Enable the firmware metadata refresh
  ansible.builtin.systemd_service:
    name: fwupd-refresh.timer
    masked: false
    enabled: true
    state: started
